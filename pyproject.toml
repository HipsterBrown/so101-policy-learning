[project]
name = "so101"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "mani_skill-nightly==2026.8.2.400",
    "torch",
    "tensorboard",
    "tyro",
    "numpy",
    "scipy",
    "imageio",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["so101"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
